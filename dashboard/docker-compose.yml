# Deploy from the REPO ROOT on the unraid box:
#   docker compose -f dashboard/docker-compose.yml up --build -d
#
# LAN-only on purpose: no Cloudflare tunnel, no public hostname, no auth. The
# drafted letters contain income, phone number and SCHUFA date, so this stays
# on the local network.
services:
  wohnung-dashboard:
    build:
      # Root context: the server imports the shared library from ../src.
      context: ..
      dockerfile: dashboard/Dockerfile
    container_name: wohnung-dashboard
    ports:
      - "8088:8088"
    restart: unless-stopped
    # Reap orphaned children rather than accumulating zombies.
    init: true
    environment:
      - NODE_ENV=production
      - DASHBOARD_PORT=8088
      - DASHBOARD_HOST=0.0.0.0
      # NOT localhost: inside a container that is the container's own loopback,
      # where nothing is listening. The scraper is a separate container on the
      # host, so it must be addressed by the host's LAN IP.
      - KLEINANZEIGEN_API_URL=http://192.168.178.40:8001
    env_file:
      # Secrets live outside git: OPENROUTER_API_KEY, KLEINANZEIGEN_API_TOKEN,
      # optionally WOHNUNG_LLM_MODEL. Copy the repo .env next to this file.
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
